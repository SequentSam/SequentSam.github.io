<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Human and agentic AI collaborating</title>
  <desc id="desc">A simple, clean illustration of a person and an AI agent sharing ideas across a screen.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- central card -->
  <rect x="210" y="130" width="780" height="370" rx="32" fill="url(#card)" stroke="#1e293b" stroke-width="2"/>
  <rect x="230" y="210" width="360" height="200" rx="20" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="620" y="210" width="330" height="160" rx="20" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>

  <!-- simple UI blocks -->
  <g transform="translate(260 240)" fill="#111827">
    <rect width="220" height="18" rx="9"/>
    <rect y="36" width="180" height="12" rx="6"/>
    <rect y="60" width="200" height="12" rx="6"/>
    <rect y="84" width="160" height="12" rx="6"/>
    <rect y="120" width="120" height="32" rx="16" fill="#06b6d4"/>
  </g>

  <g transform="translate(650 236)" fill="#111827">
    <rect width="240" height="130" rx="18" stroke="#1f2937" stroke-width="1" fill="#0b1220"/>
    <rect y="150" width="70" height="36" rx="10"/>
    <rect x="86" y="150" width="70" height="36" rx="10"/>
    <rect x="172" y="150" width="70" height="36" rx="10" stroke="#06b6d4" stroke-width="2" fill="#0b1120"/>
  </g>

  <!-- person -->
  <g transform="translate(170 330)">
    <ellipse cx="0" cy="62" rx="70" ry="20" fill="#0b1120" opacity="0.7"/>
    <circle cx="0" cy="-16" r="46" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <circle cx="-12" cy="-26" r="10" fill="#fcd34d"/>
    <circle cx="12" cy="-26" r="10" fill="#fcd34d"/>
    <path d="M -16 0 Q 0 14 16 0" stroke="#06b6d4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M -38 16 Q -120 0 -150 -20" stroke="#06b6d4" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 38 16 Q 120 0 150 -20" stroke="#22d3ee" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="-30" y="32" width="60" height="44" rx="12" fill="#0b1220" stroke="#1f2937" stroke-width="2"/>
  </g>

  <!-- AI agent -->
  <g transform="translate(1030 330)">
    <ellipse cx="0" cy="62" rx="70" ry="20" fill="#0b1120" opacity="0.7"/>
    <rect x="-42" y="-30" width="84" height="84" rx="28" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
    <rect x="-34" y="-56" width="68" height="46" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="-14" cy="-36" r="6" fill="#22d3ee"/>
    <circle cx="14" cy="-36" r="6" fill="#22d3ee"/>
    <path d="M -14 -22 Q 0 -14 14 -22" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -42 18 Q -104 -6 -140 -34" stroke="#06b6d4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 42 18 Q 110 -2 144 -28" stroke="#6366f1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-70" r="8" fill="#ec4899"/>
    <line x1="0" y1="-62" x2="0" y2="-52" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- connector lines -->
  <path d="M 320 300 C 380 250 500 250 560 300" stroke="#06b6d4" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path d="M 880 300 C 820 250 700 250 640 300" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- tiny accents -->
  <g fill="#facc15">
    <circle cx="600" cy="120" r="4"/>
    <circle cx="520" cy="500" r="3"/>
    <circle cx="700" cy="500" r="3"/>
    <circle cx="360" cy="180" r="3"/>
    <circle cx="860" cy="180" r="3"/>
  </g>
</svg>
